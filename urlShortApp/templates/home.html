{% extends "base.html" %}

{% block content %}
<div class="pt-3">
    <h1 class="card-title text-center mt-5">Shorten a URL and share it across the web</h1>
</div>
    <div class="d-flex flex-column align-items-center" style="min-height: 60vh;">

    <div class="card shadow-sm" style="width: 100%; max-width: 550px;">
        <div class="card-body p-4">
            <h4 class="card-title text-center mb-4">Shorten a URL</h4>
            <form method="POST">
            {% csrf_token %}
            <div class="d-flex">
                <input type="url" id="urlInput" name="urlInput" class="form-control" placeholder="Enter a URL...">
                <button type="submit" class="btn btn-dark ml-1"><strong> &#10148;</strong></button>
            </div>
            </form>
        </div>
    </div>
    {% if messages %}
        {% for message in messages %}
            <div class="alert mt-3 text-center alert-success" style="width: 100%; max-width: 550px;">
                Your short link: <strong>{{ request.get_host }}/{{ message }}</strong>
            </div>
        {% endfor %}
    {% endif %}
</div>
{% endblock %}
